name: Keep Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"  # every 5 minutes
  workflow_dispatch:        # optional manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Curl request to Render app
        run: |
          curl -s -o /dev/null -w "Status: %{http_code} \n" ${{ secrets.RENDER_URL }}/ping